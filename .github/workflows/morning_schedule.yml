name: Send Morning Schedule

on:
  schedule:
    # 03:35 UTC = 06:35 по МСК (08:35 по Уфе / МСК+2), пн-сб.
    # Нестандартная минута (35) избавляет от очереди GitHub Actions в начале часа.
    - cron: '35 3 * * 1-6'
  workflow_dispatch: # Позволяет запускать рассылку вручную для проверки

jobs:
  send-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch schedule and send to Telegram
        uses: actions/github-script@v7
        env:
          BOT_TOKEN: "9076066218:AAH1qA5MpifL9EUi3E0X9uAsECcIE-nnwIM"
          CHAT_ID: "-1004336760837"
          SUPABASE_URL: "https://grkefffovuisfvqgwugj.supabase.co"
          GROUP_ID: "93" # ID группы Б-26БиО в сервисе НГИЭУ
        with:
          script: |
            const botToken = process.env.BOT_TOKEN;
            const chatId = process.env.CHAT_ID;
            const groupId = process.env.GROUP_ID;

            // Точная дата по МСК (UTC+3), независимо от часового пояса сервера GitHub
            const mskNow = new Date(Date.now() + 3 * 60 * 60 * 1000);
            const dateStr = mskNow.toISOString().slice(0, 10);
            const daysOfWeek = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const dayName = daysOfWeek[mskNow.getUTCDay()];

            // Определение реального номера пары по времени начала (исключает сдвиг из-за обеда)
            function resolvePairNum(entry) {
              const m = String(entry.time_start || '').match(/(\d{1,2}):(\d{2})/);
              if (m) {
                const mins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
                if (mins < 540) return 1;   // до 09:00 (08:00)
                if (mins < 640) return 2;   // 09:00–10:40 (09:40)
                if (mins < 780) return 3;   // 10:40–13:00 (11:20 / 12:05)
                if (mins < 900) return 4;   // 13:00–15:00 (13:45)
                if (mins < 1000) return 5;  // 15:00–16:40 (15:25)
                return 6;                   // 17:05+
              }
              const parsed = String(entry.class_hour_name || '').match(/\d+/);
              return parsed ? Number(parsed[0]) : (Number(entry.class_hour_id) || 1);
            }

            const url = `https://grkefffovuisfvqgwugj.supabase.co/functions/v1/get-schedule?groupId=${groupId}&dateFrom=${dateStr}&dateTo=${dateStr}`;

            try {
              const res = await fetch(url);
              if (!res.ok) throw new Error(`API HTTP ${res.status}`);
              const data = await res.json();
              const rawEntries = Array.isArray(data.entries) ? data.entries : [];

              // Отфильтровываем отменённые пары и ставим замены поверх базового расписания
              const activeEntries = rawEntries
                .filter(e => e.occurrence_status !== 'CANCELLED' && e.occurrence_status !== 'REPLACED')
                .sort((a, b) => {
                  const aChg = (a.source_kind === 'change' || a.occurrence_status === 'SUCCESSOR' || a.occurrence_status === 'ADDED') ? 1 : 0;
                  const bChg = (b.source_kind === 'change' || b.occurrence_status === 'SUCCESSOR' || b.occurrence_status === 'ADDED') ? 1 : 0;
                  return aChg - bChg;
                });

              const slotsMap = new Map();
              for (const e of activeEntries) {
                const num = resolvePairNum(e);
                const isChange = (e.source_kind === 'change' || e.occurrence_status === 'SUCCESSOR' || e.occurrence_status === 'ADDED');
                slotsMap.set(num, { ...e, resolvedNum: num, isChange });
              }

              const finalPairs = Array.from(slotsMap.values()).sort((a, b) => a.resolvedNum - b.resolvedNum);

              if (!finalPairs.length) {
                const msg = `☀️ Доброе утро, Б-26БиО!\n📅 Сегодня ${dayName} (${dateStr})\n\n🎉 Сегодня пар нет, отдыхаем!`;
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ chat_id: chatId, text: msg })
                });
                return;
              }

              let msg = `☀️ Доброе утро, Б-26БиО!\n📅 Расписание на сегодня (${dayName}):\n\n`;

              for (const e of finalPairs) {
                const tStart = e.time_start ? String(e.time_start).slice(0, 5) : '';
                const tEnd = e.time_end ? String(e.time_end).slice(0, 5) : '';
                const time = (tStart && tEnd) ? `[${tStart}–${tEnd}]` : '';
                const type = e.subject_type_name ? `(${e.subject_type_name})` : '';
                const room = e.classroom_name ? `📍 ${e.classroom_name}` : '';
                const teacher = e.instructor_display ? `👨‍🏫 ${e.instructor_display}` : '';
                const chgTag = e.isChange ? ' 🔄 Замена' : '';

                msg += `🔹 ${e.resolvedNum} пара ${time} ${type}${chgTag}\n   📖 ${e.subject_name || 'Дисциплина'}\n   ${room} ${teacher}\n\n`;
              }

              msg += `📱 Подробнее в мини-аппе Старостат`;

              const tgRes = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: msg })
              });
              const tgData = await tgRes.json();
              if (!tgData.ok) throw new Error(`Telegram API error: ${JSON.stringify(tgData)}`);

              console.log(`Расписание (${finalPairs.length} пар) успешно отправлено в чат.`);
            } catch (err) {
              console.error('Ошибка отправки:', err);
              throw err;
            }
